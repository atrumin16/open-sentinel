name: Python Lint & Sanity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Syntax Check
      run: |
        python -m py_compile main.py
        python -m py_compile src/config.py
        python -m py_compile src/core/hardware.py
        python -m py_compile src/core/network.py
        python -m py_compile src/core/surveillance.py
        python -m py_compile src/core/defcon.py
        python -m py_compile src/core/power.py
        python -m py_compile src/core/process_mgr.py
        python -m py_compile src/notifiers/discord.py
        python -m py_compile src/notifiers/telegram.py
        python -m py_compile src/notifiers/whatsapp.py
        python -m py_compile src/web/app.py
