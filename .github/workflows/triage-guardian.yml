name: Sentinel Issue & PR Guardian

on:
  issues:
    types: [ opened ]
  pull_request_target:
    types: [ opened ]

permissions:
  issues: write
  pull-requests: write

jobs:
  triage:
    name: Zero-Trust Triage & Classification
    runs-on: ubuntu-latest

    steps:
      - name: Triage Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const labels = [];

            if (title.includes('security') || body.includes('vulnerability') || title.includes('cve') || title.includes('leak')) {
              labels.push('security');
            } else if (title.includes('bug') || title.includes('error') || title.includes('crash') || title.includes('fail')) {
              labels.push('bug');
            } else if (title.includes('feature') || title.includes('feat') || title.includes('enhancement')) {
              labels.push('enhancement');
            } else {
              labels.push('triage');
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🛡️ **Open-Sentinel Automated Guardian (trujillo-bot)**\n\nThank you for opening this issue. It has been registered and auto-classified with: \`${labels.join(', ')}\`.\n\nOur automated security scanner verifies incoming reports. Maintainers will review this shortly.`
            });

      - name: Triage Pull Request
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-review']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🛡️ **Open-Sentinel Automated Guardian (trujillo-bot)**\n\nPull Request registered. Automated SAST, entropy scanning, and bytecode checks have been scheduled.\n\nPlease ensure your commits adhere to Zero-Trust integrity specifications.`
            });
